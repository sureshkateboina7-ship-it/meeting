<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>No-Helmet Detection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{{ url_for('pages.home') }}" aria-label="No-Helmet Detection home">
            <span class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 48 48" role="img">
                    <path d="M8 25c0-9.4 7.1-17 16-17s16 7.6 16 17v5H8v-5Z"></path>
                    <path d="M12 30h24l-3 8H15l-3-8Z"></path>
                    <path d="M18 19h12"></path>
                </svg>
            </span>
            <span class="brand-text">No-Helmet Detection</span>
        </a>
        <nav aria-label="Primary navigation">
            <a href="{{ url_for('pages.home') }}">Home</a>
            <a href="{{ url_for('pages.image') }}">Image</a>
            <a href="{{ url_for('pages.video') }}">Video</a>
            <a href="{{ url_for('pages.live') }}">Live Camera</a>
            <a href="{{ url_for('pages.dashboard') }}">Violations</a>
            <a href="{{ url_for('pages.email') }}">Email</a>
            <a href="{{ url_for('pages.about') }}">About</a>
        </nav>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <footer class="footer">
        <p>Smart No Helmet Detection + ANPR</p>
    </footer>
</body>
</html>
